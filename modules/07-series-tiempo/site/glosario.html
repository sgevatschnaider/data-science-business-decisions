<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glosario · Series de Tiempo y Forecasting</title><link rel="stylesheet" href="styles.css"><script defer src="site.js"></script></head><body><header class="top"><div class="wrap"><div class="brand"><span>07</span> · Glosario de estudio</div><nav><a class="btn" href="index.html">← Módulo</a><a class="btn" href="cuestionario.html">Cuestionario</a><button onclick="toggleTheme()">◐ Tema</button></nav></div></header><main class="section"><div class="wrap"><div class="eyebrow">Consulta rápida + estudio</div><h1>Conceptos clave de series de tiempo</h1><p class="lead">Buscá por término o definición y filtrá por familia conceptual.</p><div class="toolbar"><input class="search" id="q" placeholder="Buscar: estacionariedad, ARIMA, leakage, MASE…"><select id="cat"><option value="">Todas las categorías</option><option>Fundamentos</option><option>Dependencia</option><option>Modelos</option><option>Validación</option><option>Métricas</option><option>Machine Learning</option><option>Probabilístico</option></select></div><div class="card"><div id="count" class="small"></div><div id="terms"></div></div></div></main><script>
const T=[
['Serie de tiempo','Fundamentos','Secuencia de observaciones indexadas por tiempo, donde el orden forma parte de la información.'],['Frecuencia','Fundamentos','Intervalo regular de observación: hora, día, semana, mes, trimestre u otra periodicidad.'],['Tendencia','Fundamentos','Movimiento persistente del nivel de la serie a mediano o largo plazo.'],['Ciclo','Fundamentos','Oscilación de duración no necesariamente fija, a menudo asociada con fases económicas o de negocio.'],['Estacionalidad','Fundamentos','Patrón que se repite con una periodicidad relativamente estable.'],['Irregularidad','Fundamentos','Componente residual, shock o perturbación no explicada por la estructura sistemática.'],['Modelo aditivo','Fundamentos','Representación donde los componentes se suman y la amplitud estacional es aproximadamente constante.'],['Modelo multiplicativo','Fundamentos','Representación donde los componentes se multiplican y la estacionalidad cambia proporcionalmente al nivel.'],['Desestacionalización','Fundamentos','Remoción del patrón estacional para analizar nivel, tendencia o ciclo con mayor claridad.'],['Promedio móvil','Fundamentos','Suavizado que reemplaza observaciones por promedios de una ventana. Para forecasting debe definirse de forma causal.'],['Ventana causal','Fundamentos','Ventana que termina antes o en el origen y no utiliza datos posteriores.'],['Cambio de régimen','Fundamentos','Cambio persistente en nivel, tendencia, varianza o dinámica de la serie.'],['Autocorrelación','Dependencia','Correlación de una serie con sus propios valores rezagados.'],['ACF','Dependencia','Función de autocorrelación: correlación entre y(t) e y(t−k) para distintos rezagos k.'],['PACF','Dependencia','Autocorrelación parcial: asociación con un lag controlando la relación lineal de rezagos intermedios.'],['Lag','Dependencia','Valor pasado desplazado k períodos y usado como predictor o herramienta diagnóstica.'],['Estacionariedad débil','Dependencia','Propiedad por la cual media, varianza y autocovarianza dependen de forma estable del rezago y no del tiempo calendario.'],['Raíz unitaria','Dependencia','Fuente de persistencia no estacionaria donde shocks pueden tener efectos muy duraderos.'],['Diferenciación','Dependencia','Transformación y(t)−y(t−1), o estacional, usada para modelar cambios y reducir no estacionariedad.'],['Diferencia estacional','Dependencia','Transformación y(t)−y(t−s) que elimina parte de un patrón repetido cada s períodos.'],['Ruido blanco','Dependencia','Proceso con media aproximadamente cero, varianza estable y ausencia de autocorrelación sistemática.'],['AR','Modelos','Modelo autorregresivo que usa valores pasados de la serie.'],['MA','Modelos','Modelo de media móvil de innovaciones que usa errores pasados, no el promedio móvil descriptivo.'],['ARMA','Modelos','Combinación de términos autorregresivos y de media móvil para series estacionarias.'],['ARIMA','Modelos','Modelo ARIMA(p,d,q): autorregresión, diferenciación e innovaciones de media móvil.'],['SARIMA','Modelos','Extensión de ARIMA con órdenes estacionales (P,D,Q) y período s.'],['ETS','Modelos','Familia Error-Trend-Seasonal que representa nivel, tendencia y estacionalidad mediante suavizado exponencial.'],['Holt','Modelos','Suavizado exponencial con nivel y tendencia.'],['Holt-Winters','Modelos','Suavizado exponencial que incorpora nivel, tendencia y estacionalidad.'],['STL','Modelos','Descomposición robusta de una serie en tendencia, estacionalidad y residuo mediante LOESS.'],['Residual','Modelos','Diferencia entre observación y valor ajustado o predicho; debe diagnosticarse por estructura restante.'],['Baseline ingenuo','Validación','Pronóstico que repite el último valor observado.'],['Baseline estacional','Validación','Pronóstico que repite el valor del mismo punto del ciclo anterior.'],['Origen de pronóstico','Validación','Último instante cuya información está disponible al construir un forecast.'],['Horizonte','Validación','Cantidad de pasos entre el origen y el período que se pronostica.'],['Walk-forward','Validación','Evaluación temporal que desplaza el origen hacia adelante respetando la secuencia pasado→futuro.'],['Expanding window','Validación','Backtesting en el que el conjunto de entrenamiento crece a medida que avanza el origen.'],['Rolling window','Validación','Backtesting que conserva una ventana de entrenamiento de longitud aproximadamente fija.'],['Gap','Validación','Separación entre el final de train y el inicio de validation para reflejar latencia o evitar contaminación.'],['Backtesting','Validación','Simulación de múltiples decisiones históricas para estimar desempeño fuera de muestra.'],['Future leakage','Validación','Uso directo o indirecto de información que no existía en el origen de pronóstico.'],['Forecast Value Added','Validación','Comparación incremental para verificar si cada etapa mejora un baseline previo.'],['MAE','Métricas','Promedio del error absoluto; conserva las unidades de la variable objetivo.'],['RMSE','Métricas','Raíz del error cuadrático medio; penaliza con mayor fuerza errores grandes.'],['MAPE','Métricas','Promedio del error porcentual absoluto; problemático con valores cero o muy pequeños.'],['sMAPE','Métricas','Versión simétrica de error porcentual que reduce algunas asimetrías de MAPE, pero conserva limitaciones.'],['MASE','Métricas','MAE escalado por el error de un método naive; facilita comparar series de diferente escala.'],['Bias de forecast','Métricas','Error medio con signo; detecta sobrepronóstico o subpronóstico sistemático.'],['Cobertura','Probabilístico','Proporción de observaciones que cae dentro de un intervalo predictivo nominal.'],['Cuantil','Probabilístico','Valor pronosticado asociado a una probabilidad acumulada, útil para decisiones asimétricas.'],['Pinball loss','Probabilístico','Función de pérdida usada para evaluar pronósticos de cuantiles.'],['Intervalo predictivo','Probabilístico','Rango que busca contener un valor futuro con una probabilidad nominal determinada.'],['Calibración','Probabilístico','Correspondencia entre incertidumbre pronosticada y frecuencias observadas.'],['Feature temporal','Machine Learning','Predictor construido a partir de lags, ventanas, calendario, eventos u otras señales disponibles en el origen.'],['Reformulación supervisada','Machine Learning','Conversión de una serie en filas X,y usando observaciones pasadas para predecir valores futuros.'],['Recursive forecasting','Machine Learning','Estrategia multi-step que realimenta predicciones previas como entradas de pasos posteriores.'],['Direct forecasting','Machine Learning','Estrategia que ajusta una predicción o modelo específico para cada horizonte.'],['Multi-output','Machine Learning','Modelo que predice varios horizontes simultáneamente.'],['Feature importance temporal','Machine Learning','Medida de uso predictivo que debe calcularse con particiones temporales, no sobre datos mezclados.'],['Concept drift','Machine Learning','Cambio en la relación entre predictores y objetivo a través del tiempo.'],['Data drift','Machine Learning','Cambio en la distribución de variables de entrada respecto del período de referencia.']];
const q=document.getElementById('q'),cat=document.getElementById('cat'),box=document.getElementById('terms'),count=document.getElementById('count');function render(){const s=q.value.toLowerCase().trim(),c=cat.value;const f=T.filter(t=>(!c||t[1]===c)&&(!s||(t[0]+' '+t[2]).toLowerCase().includes(s)));count.textContent=`${f.length} conceptos visibles de ${T.length}`;box.innerHTML=f.map(t=>`<div class="term"><b>${t[0]}</b> <span class="chip">${t[1]}</span><div>${t[2]}</div></div>`).join('')||'<p>No hay coincidencias.</p>'}q.oninput=cat.onchange=render;render();
</script></body></html>
