<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuestionario avanzado · Series de Tiempo</title><link rel="stylesheet" href="styles.css"><script defer src="site.js"></script></head><body><header class="top"><div class="wrap"><div class="brand"><span>07</span> · Cuestionario avanzado</div><nav><a class="btn" href="index.html">← Módulo</a><a class="btn" href="glosario.html">Glosario →</a><button onclick="toggleTheme()">◐ Tema</button></nav></div></header><main class="section" data-question-count="20"><div class="wrap"><div class="eyebrow">Autoevaluación con explicación</div><h1>Series de tiempo y forecasting</h1><p class="lead">Respondé cada pregunta. La corrección aparece al instante y explica el criterio, no solo la opción correcta.</p><div class="metrics"><div class="metric">Respondidas<b id="answered">0/20</b></div><div class="metric">Correctas<b id="correct">0</b></div><div class="metric">Puntaje<b id="score">0%</b></div><div class="metric">Meta<b>≥ 80%</b></div></div><div id="quiz"></div><div class="actions"><button class="primary" onclick="resetQuiz()">Reiniciar cuestionario</button><a class="btn" href="simulacion.html">Volver a simulaciones</a></div></div></main><script>
const Q=[
['¿Qué distingue una serie temporal de una tabla sin orden?',['La fecha contiene estructura y dependencia','Tiene siempre una sola variable','No admite valores faltantes','Debe ser mensual'],0,'El orden puede contener tendencia, estacionalidad y autocorrelación; barajar observaciones destruye esa estructura.'],
['En una descomposición multiplicativa, la estacionalidad suele ser adecuada cuando:',['Su amplitud crece con el nivel','La amplitud es constante en unidades','No existe tendencia','Los datos son binarios'],0,'En un esquema multiplicativo el efecto estacional es proporcional al nivel.'],
['Una media móvil centrada usada como feature de forecasting puede:',['Incorporar observaciones futuras','Eliminar cualquier tendencia','Garantizar estacionariedad','Evitar backtesting'],0,'Alrededor de t, una ventana centrada incluye t+1, t+2, etc.; esos datos no existen en el origen.'],
['¿Qué es un lag 7?',['El valor observado siete períodos atrás','El séptimo pronóstico futuro','Una media de siete períodos','La séptima diferencia'],0,'Un lag desplaza la serie hacia atrás y usa información histórica como predictor.'],
['¿Qué representa el horizonte h?',['La distancia entre origen y período pronosticado','La longitud total del dataset','La cantidad de variables','La frecuencia estacional'],0,'h=1 es un paso adelante; h=12, doce pasos desde el mismo origen.'],
['¿Para qué sirve un baseline estacional?',['Para repetir el valor del ciclo anterior y fijar una referencia fuerte','Para ajustar hiperparámetros','Para eliminar test','Para medir causalidad'],0,'Una solución compleja debe demostrar mejora sobre reglas simples plausibles.'],
['Backtesting de origen rodante significa:',['Evaluar desde múltiples puntos históricos respetando pasado→futuro','Barajar la serie muchas veces','Usar solo el último dato','Optimizar sobre test'],0,'Simula decisiones que podrían haberse tomado históricamente con la información disponible entonces.'],
['¿Qué debe ocurrir con train y validation en forecasting?',['Train debe preceder temporalmente a validation','Pueden mezclarse libremente','Validation debe ser anterior','La fecha debe eliminarse'],0,'La evaluación debe imitar la secuencia real de disponibilidad de datos.'],
['Una serie estacionaria, en sentido débil, mantiene aproximadamente:',['Media, varianza y autocovarianza dependiente del rezago','Solo el máximo','La pendiente positiva','La estacionalidad creciente'],0,'La estacionariedad débil exige propiedades de primer y segundo orden estables en el tiempo.'],
['¿Qué suele buscar la diferenciación?',['Reducir tendencia o raíz unitaria','Crear categorías','Aumentar siempre la media','Eliminar toda autocorrelación'],0,'Diferenciar puede estabilizar el nivel y ayudar a modelar cambios en lugar de niveles.'],
['La ACF en el rezago k mide:',['Correlación entre y(t) e y(t−k)','Error de clasificación','Importancia causal','Probabilidad de outlier'],0,'La función de autocorrelación resume dependencia lineal con rezagos.'],
['La PACF intenta medir:',['Relación con un rezago controlando rezagos intermedios','Promedio móvil centrado','Error absoluto','Estacionalidad multiplicativa'],0,'La autocorrelación parcial aísla la contribución lineal de un lag dado.'],
['ARIMA combina principalmente:',['Autorregresión, integración y media móvil de errores','Árboles y clustering','PCA y K-Means','Solo tendencia lineal'],0,'ARIMA(p,d,q) combina AR, diferenciación e innovación MA.'],
['SARIMA agrega a ARIMA:',['Estructura estacional explícita','Etiquetas de clase','Solo una transformación log','Random Forest'],0,'Incluye órdenes estacionales y un período s.'],
['¿Qué familia modela nivel, tendencia y estacionalidad mediante suavizado exponencial?',['ETS/Holt-Winters','KNN','DBSCAN','Regresión logística'],0,'ETS y Holt-Winters actualizan componentes con ponderaciones decrecientes.'],
['Ajustar un scaler con toda la serie antes del split produce:',['Leakage','Estacionalidad','Un baseline','Diferenciación'],0,'El scaler aprende estadísticas de períodos que, en un backtest real, aún no habrían ocurrido.'],
['Para ML temporal, una feature calendario como mes es válida si:',['Está conocida en el origen del pronóstico','Se calcula con el target futuro','Solo aparece en test','Se deriva del error final'],0,'Calendario futuro suele ser conocido; targets o agregados futuros no.'],
['¿Por qué reportar error por horizonte?',['Porque la dificultad puede cambiar con la distancia al origen','Porque todas las métricas son iguales','Para ocultar errores','Porque h no influye'],0,'Un buen modelo a h=1 puede deteriorarse mucho a h=12; el promedio global oculta esa diferencia.'],
['¿Qué ventaja tiene MASE frente a MAE para comparar series?',['Escala el error respecto de un naive y facilita comparabilidad','Siempre vale entre 0 y 1','Ignora el baseline','Solo sirve para clasificación'],0,'MASE normaliza el MAE por un error naive in-sample; valores <1 implican mejora frente a esa referencia.'],
['Un pronóstico probabilístico debería evaluarse también por:',['Calibración y cobertura además de precisión puntual','Solo R² de train','Cantidad de variables','Tamaño del archivo'],0,'Cuantiles e intervalos deben ser útiles y estar razonablemente calibrados, no solo centrados.']];
let state=Array(Q.length).fill(null);const quiz=document.getElementById('quiz');function render(){quiz.innerHTML=Q.map((q,i)=>`<article class="card quiz-q"><span class="num">${String(i+1).padStart(2,'0')}</span><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="option ${state[i]!==null?(j===q[2]?'correct':state[i]===j?'wrong':''):''}" ${state[i]!==null?'disabled':''} onclick="answer(${i},${j})">${o}</button>`).join('')}<div class="explain ${state[i]!==null?'show':''}"><strong>${state[i]===q[2]?'Correcto':'Revisar concepto'}.</strong> ${q[3]}</div></article>`).join('');const a=state.filter(x=>x!==null).length,c=state.reduce((n,x,i)=>n+(x===Q[i][2]),0);document.getElementById('answered').textContent=`${a}/${Q.length}`;document.getElementById('correct').textContent=c;document.getElementById('score').textContent=a?Math.round(c/a*100)+'%':'0%'}window.answer=(i,j)=>{if(state[i]===null){state[i]=j;render()}};window.resetQuiz=()=>{state=Array(Q.length).fill(null);render();scrollTo({top:0,behavior:'smooth'})};render();
</script></body></html>
