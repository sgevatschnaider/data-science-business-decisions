<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glosario avanzado · Regresión Logística</title><link rel="stylesheet" href="styles.css"><script defer src="site.js"></script></head><body><header class="top"><div class="wrap"><div class="brand"><span>08</span> · Glosario avanzado</div><nav><a class="btn" href="index.html">← Módulo</a><a class="btn" href="simulacion.html">Laboratorio</a><a class="btn" href="cuestionario.html">Cuestionario</a><button onclick="toggleTheme()">◐ Tema</button></nav></div></header><main class="section"><div class="wrap"><div class="eyebrow">Guía de estudio</div><h1 class="page-title">Conceptos clave de regresión logística y clasificación</h1><p class="lead">Buscá por término, definición o familia conceptual. Las definiciones priorizan interpretación correcta, validación y decisión.</p><div class="toolbar"><input class="search" id="q" placeholder="Buscar: odds ratio, calibración, threshold, drift…"><select id="cat"><option value="">Todas las categorías</option><option>Fundamentos</option><option>Interpretación</option><option>Estimación</option><option>Métricas</option><option>Validación</option><option>Regularización</option><option>Decisión</option><option>Multiclase</option><option>Producción</option></select></div><div class="card"><div id="count" class="small"></div><div id="terms"></div></div></div></main><script>
const T=[
['Clasificación binaria','Fundamentos','Problema supervisado donde Y toma dos clases, usualmente codificadas 0 y 1.'],
['Clase positiva','Fundamentos','Evento de interés definido como Y=1; su elección determina cómo se leen precision, recall y costos.'],
['Probabilidad condicional','Fundamentos','P(Y=1|X): probabilidad del evento dadas las variables explicativas observadas.'],
['Score lineal','Fundamentos','z=β₀+β₁x₁+…+βkxk. Puede tomar cualquier valor real y es lineal en los parámetros.'],
['Sigmoide','Fundamentos','σ(z)=1/(1+e^-z). Transforma el score real en una probabilidad entre 0 y 1.'],
['Logit','Fundamentos','log[p/(1-p)]. Es la inversa de la sigmoide y vuelve lineal la relación entre covariables y log-odds.'],
['Odds','Fundamentos','p/(1-p). Relación entre probabilidad de evento y no evento.'],
['Intercepto','Interpretación','β₀: log-odds cuando todas las covariables valen cero, siempre que ese punto tenga interpretación sustantiva.'],
['Coeficiente logístico','Interpretación','Cambio aditivo en log-odds ante una unidad adicional de x, manteniendo las demás variables constantes.'],
['Odds ratio','Interpretación','exp(β). Factor multiplicativo aplicado a los odds por una unidad adicional de la covariable.'],
['Ceteris paribus','Interpretación','Interpretación condicional: variar una covariable manteniendo fijas las demás incluidas en el modelo.'],
['Efecto marginal','Interpretación','Cambio local en p respecto de x; para una x continua en logit es β·p(1-p).'],
['AME','Interpretación','Average Marginal Effect: promedio de efectos marginales calculados para las observaciones.'],
['MEM','Interpretación','Marginal Effect at the Mean: efecto calculado en el vector de medias; puede representar un caso poco realista.'],
['Dummy','Interpretación','Indicador 0/1 para pertenencia a una categoría; se interpreta respecto de una categoría de referencia.'],
['Categoría de referencia','Interpretación','Nivel omitido frente al cual se interpretan coeficientes de variables categóricas.'],
['Interacción','Interpretación','Término que hace que el efecto de una variable dependa del nivel de otra.'],
['No linealidad en X','Interpretación','Términos como x² o splines permiten que el logit cambie de forma no lineal con una covariable.'],
['Máxima verosimilitud','Estimación','Método que elige parámetros que maximizan la probabilidad de observar las clases registradas bajo el modelo.'],
['Likelihood','Estimación','Función de los parámetros que cuantifica cuán compatibles son los datos observados con el modelo.'],
['Log-likelihood','Estimación','Logaritmo de la likelihood; convierte productos en sumas y facilita optimización numérica.'],
['Log-loss','Estimación','Pérdida probabilística -[y log p +(1-y)log(1-p)]; castiga mucho la confianza equivocada.'],
['Entropía cruzada binaria','Estimación','Otro nombre frecuente para la log-loss Bernoulli.'],
['Separación completa','Estimación','Situación donde una combinación de predictores separa perfectamente clases y los coeficientes MLE pueden divergir.'],
['Matriz de confusión','Métricas','Tabla de TP, FP, FN y TN para un threshold específico.'],
['True Positive','Métricas','Caso positivo real correctamente clasificado como positivo.'],
['False Positive','Métricas','Caso negativo real clasificado como positivo; su costo depende de la acción asociada.'],
['False Negative','Métricas','Caso positivo real clasificado como negativo; puede representar oportunidad o riesgo no detectado.'],
['True Negative','Métricas','Caso negativo real correctamente clasificado como negativo.'],
['Accuracy','Métricas','(TP+TN)/N. Puede ser engañosa con fuerte desbalance o costos asimétricos.'],
['Precision','Métricas','TP/(TP+FP). Entre los casos señalados positivos, proporción realmente positiva.'],
['Recall / Sensitivity','Métricas','TP/(TP+FN). Entre los positivos reales, proporción detectada.'],
['Specificity','Métricas','TN/(TN+FP). Entre los negativos reales, proporción correctamente descartada.'],
['F1','Métricas','Media armónica de precision y recall; útil como resumen, pero no reemplaza una función explícita de valor.'],
['Threshold','Decisión','Umbral que transforma probabilidad o score en una acción/clase. No es un parámetro que deba quedar fijado en 0,5 por costumbre.'],
['ROC','Métricas','Curva TPR vs FPR a través de thresholds.'],
['ROC-AUC','Métricas','Resumen de discriminación/ranking; no evalúa calibración absoluta.'],
['Precision–Recall','Métricas','Curva de precision frente a recall. Especialmente útil cuando la clase positiva es rara.'],
['Average Precision','Métricas','Resumen de precision–recall a distintos niveles de recall; su baseline depende de la prevalencia.'],
['Calibración','Métricas','Concordancia entre probabilidades pronosticadas y frecuencias observadas.'],
['Diagrama de confiabilidad','Métricas','Compara probabilidad media predicha con frecuencia observada por grupos de score.'],
['Brier score','Métricas','Promedio de (p-y)²; evalúa calidad de probabilidades. Menor es mejor.'],
['Discriminación','Métricas','Capacidad de ordenar casos positivos por encima de negativos. Puede ser buena aun con mala calibración.'],
['Train set','Validación','Datos usados para ajustar parámetros del modelo.'],
['Validation set','Validación','Datos usados para seleccionar especificación, hiperparámetros y política antes de tocar test.'],
['Test set','Validación','Muestra sellada para una estimación final del desempeño fuera de muestra.'],
['Cross-validation','Validación','Repetición de particiones train/validation para estimar desempeño y variabilidad del proceso de modelado.'],
['Stratified K-fold','Validación','K-fold que preserva aproximadamente la proporción de clases en cada fold.'],
['Leakage','Validación','Información no disponible en el momento de predicción que entra directa o indirectamente al entrenamiento/evaluación.'],
['Pipeline','Validación','Encapsula transformaciones y estimador para que cada paso se ajuste solo con los datos permitidos.'],
['Generalización','Validación','Capacidad de mantener desempeño en observaciones nuevas.'],
['Overfitting','Validación','Ajuste excesivo al ruido de entrenamiento que deteriora desempeño fuera de muestra.'],
['Regularización','Regularización','Penalización de complejidad que reduce magnitudes de coeficientes y puede mejorar generalización.'],
['L1 / Lasso','Regularización','Penaliza suma de valores absolutos y puede llevar coeficientes exactamente a cero.'],
['L2 / Ridge','Regularización','Penaliza suma de cuadrados y contrae coeficientes suavemente.'],
['C','Regularización','En scikit-learn, inverso de la fuerza de regularización: C pequeño implica penalización más fuerte.'],
['Costo de falso positivo','Decisión','Pérdida asociada a actuar sobre un caso que finalmente es negativo.'],
['Costo de falso negativo','Decisión','Pérdida asociada a no actuar sobre un caso que era positivo.'],
['Valor esperado','Decisión','Combina probabilidades, beneficios, costos y acciones para comparar políticas en unidades de negocio.'],
['Restricción de capacidad','Decisión','Límite operativo sobre cuántos casos pueden recibir una intervención; convierte el ranking en una política de selección.'],
['Lift','Decisión','Mejora de tasa de respuesta/evento en un segmento seleccionado respecto de la tasa base.'],
['Gain','Decisión','Proporción acumulada de positivos capturados al actuar sobre una fracción ordenada de la población.'],
['Softmax','Multiclase','Transforma K logits en probabilidades positivas que suman 1.'],
['Temperatura','Multiclase','Escala logits antes de softmax: valores altos aplanan probabilidades; valores bajos las concentran.'],
['Regresión logística multinomial','Multiclase','Extensión que modela múltiples clases mutuamente excluyentes mediante logits relativos/softmax.'],
['One-vs-Rest','Multiclase','Estrategia que entrena un clasificador binario por clase contra el resto.'],
['Model drift','Producción','Degradación causada por cambios en datos, relaciones o contexto respecto del período de entrenamiento.'],
['Covariate shift','Producción','Cambia P(X) mientras puede mantenerse aproximadamente P(Y|X).'],
['Prior probability shift','Producción','Cambia la prevalencia P(Y), alterando base rate y posiblemente la calibración.'],
['Concept drift','Producción','Cambia la relación P(Y|X), por lo que la función predictiva aprendida deja de representar el proceso actual.'],
['PSI','Producción','Population Stability Index: indicador de cambio distribucional por bins; es diagnóstico, no prueba causal.'],
['Recalibración','Producción','Ajuste posterior de probabilidades para corregir desviaciones de calibración sin necesariamente reentrenar todo el modelo.'],
['Monitoreo','Producción','Seguimiento conjunto de datos, prevalencia, discriminación, calibración, costos y volumen de acciones.']
];
const q=document.getElementById('q'),cat=document.getElementById('cat'),box=document.getElementById('terms'),count=document.getElementById('count');
function render(){const s=q.value.trim().toLowerCase(),c=cat.value;const f=T.filter(t=>(!c||t[1]===c)&&(!s||(t[0]+' '+t[1]+' '+t[2]).toLowerCase().includes(s)));count.textContent=f.length+' de '+T.length+' términos';box.innerHTML=f.map(t=>'<div class="term"><b>'+t[0]+'</b> <span class="pill">'+t[1]+'</span><div>'+t[2]+'</div></div>').join('')}
q.addEventListener('input',render);cat.addEventListener('change',render);render();
</script></body></html>
